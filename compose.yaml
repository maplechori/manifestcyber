services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbom}
      POSTGRES_USER: ${POSTGRES_USER:-sbom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbom}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SBOM_DATABASE: postgresql://
      PGUSER: ${POSTGRES_USER:-sbom}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sbom}
      PGDATABASE: ${POSTGRES_DB:-sbom}
      PGHOST: postgres
    entrypoint: ["flask", "--app", "api:create_app", "init-db"]

  api:
    build: .
    entrypoint: ["flask", "--app", "api:create_app", "run", "--host=0.0.0.0"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      SBOM_DATABASE: postgresql://
      PGUSER: ${POSTGRES_USER:-sbom}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sbom}
      PGDATABASE: ${POSTGRES_DB:-sbom}
      PGHOST: postgres
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"

volumes:
  postgres_data:
