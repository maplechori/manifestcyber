[project]
name = "manifest-sbom-cli"
version = "0.1.0"
description = "A minimal CycloneDX SBOM ingestion and query CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0,<3", "ijson>=3.3,<4", "flask>=3.1,<4", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["ruff>=0.17.3,<0.18", "pre-commit>=4.3,<5"]

[project.scripts]
sbom-cli = "sbom_cli:main"

[tool.setuptools]
py-modules = ["sbom_cli", "database", "parsers", "service", "remote", "api", "spdx3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = ["sbom-cli"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
